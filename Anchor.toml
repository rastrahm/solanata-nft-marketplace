[toolchain]
anchor_version = "0.31.1"
solana_version = "2.2.20"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
marketplace = "5HwkQykA3irfntrPftwmDc2dcSUjRP3RwYga8Y3Yu6DE"

[programs.devnet]
marketplace = "5HwkQykA3irfntrPftwmDc2dcSUjRP3RwYga8Y3Yu6DE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.test.ts\""
