[toolchain]
anchor_version = "0.31.1"
solana_version = "2.2.20"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
marketplace = "5HwkQykA3irfntrPftwmDc2dcSUjRP3RwYga8Y3Yu6DE"

[programs.devnet]
marketplace = "5HwkQykA3irfntrPftwmDc2dcSUjRP3RwYga8Y3Yu6DE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Metaplex Token Metadata (volcado de mainnet con `solana program dump`) para probar royalties.
[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/mpl_token_metadata.so"

[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.test.ts\""
