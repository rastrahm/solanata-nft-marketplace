[package]
name = "marketplace"
version = "0.1.0"
description = "Marketplace de NFTs en Solana con escrow PDA y comisión en BPS"
edition = "2021"
rust-version = "1.84.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["associated_token", "token", "token_2022"] }

[lints]
workspace = true
