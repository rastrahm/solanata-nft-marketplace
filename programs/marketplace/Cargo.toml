[package]
name = "marketplace"
version = "0.1.0"
description = "Marketplace de NFTs en Solana con escrow PDA y comisión en BPS"
edition = "2021"
rust-version = "1.84.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"

[lints]
workspace = true
